version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medicore-db
    environment:
      POSTGRES_USER: medicore_admin
      POSTGRES_PASSWORD: medicore_secure_password_2026
      POSTGRES_DB: medicore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: medicore-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://medicore_admin:medicore_secure_password_2026@postgres:5432/medicore?schema=public"
      JWT_SECRET: "medicore_super_secret_jwt_key_2026_academics"
      AI_SERVICE_URL: "http://ai-service:8000"
    depends_on:
      - postgres

  ai-service:
    build: ./ai-service
    container_name: medicore-ai
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ENVIRONMENT: production

  frontend:
    build: ./frontend
    container_name: medicore-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:

